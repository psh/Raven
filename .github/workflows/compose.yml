# compose-raven: the Kotlin/Native modules in compose/, built and tested headless on each host that
# has a target (compose/docs/spec.md, section 9). Each runner builds only its own target, and
# libraven with it, through Raven's CMake build.
#
# `allTests` fails on a failing test, on a leak (the tests check that Raven holds no block and no
# widget reference after Rshutdown), on a linker-option drift (:raven-native:checkRavenLinkerOpts,
# which the cinterop depends on) and on the xml-translator's examples check.
#
# Kept apart from build.yml, which is upstream Raven's, so rebasing the fork on upstream never
# conflicts here.

name: compose

on:
  push:
    branches: ["**"]
    paths:
      - "compose/**"
      - "src/**"
      - "include/**"
      - "cmake/**"
      - "third_party/**"
      - "CMakeLists.txt"
      - "examples/**/*.xml"
      - ".github/workflows/compose.yml"
  pull_request:
    paths:
      - "compose/**"
      - "src/**"
      - "include/**"
      - "cmake/**"
      - "third_party/**"
      - "CMakeLists.txt"
      - "examples/**/*.xml"
      - ".github/workflows/compose.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: compose (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: macosArm64 }
          - { os: ubuntu-latest, target: linuxX64 }
    env:
      # libraven's objects come from ccache: a restored CMake build directory would be rebuilt
      # anyway, since a fresh checkout makes every source newer than it.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev ccache

      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ccache

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle's own caches (dependencies, wrapper, build cache).
      - uses: gradle/actions/setup-gradle@v4

      # Kotlin/Native's compiler, sysroots and per-target caches, by Kotlin version.
      - name: Kotlin/Native cache
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('compose/gradle/libs.versions.toml') }}

      # libraven's compiled objects, by Raven's sources; an older entry still serves what didn't change.
      - name: libraven cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('src/**', 'include/**', 'cmake/**', 'third_party/**', 'CMakeLists.txt') }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Build and test
        working-directory: compose
        run: ./gradlew allTests --continue

      - name: ccache statistics
        if: always()
        run: ccache --show-stats || true

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-test-reports-${{ matrix.target }}
          path: |
            compose/**/build/reports/tests/
            compose/**/build/test-results/
          if-no-files-found: ignore
