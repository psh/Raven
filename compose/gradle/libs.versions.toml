[versions]
kotlin = "2.4.21"
compose-runtime = "1.12.1"
# The versions navigation3-runtime 1.2.1 brings, so the window owners and Navigation 3 agree.
lifecycle = "2.10.0"
savedstate = "1.4.0"
navigationevent = "1.1.1"
navigation3 = "1.2.1"

[libraries]
compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose-runtime" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
savedstate-compose = { module = "androidx.savedstate:savedstate-compose", version.ref = "savedstate" }
navigationevent = { module = "androidx.navigationevent:navigationevent", version.ref = "navigationevent" }
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
