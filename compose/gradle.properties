# Kotlin/Native compiles and links inside the Gradle daemon, so the samples' release executables,
# linked in parallel, share its heap: at 4g, two of them ran out of it.
org.gradle.jvmargs=-Xmx8g
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
# Each target builds on its own host (spec section 2), so the other targets are always disabled.
kotlin.native.ignoreDisabledTargets=true
